# All transforms follow p_A = T_A_B p_B. Generate calibration.yaml with odin1-prepare.
calibration_file: calibration.yaml
robot_name: odin1
output_width: 640
output_height: 518
camera_rate_hz: 10.259
imu_rate_hz: 400.8
confidence_threshold: 35
min_depth_m: 0.3
max_depth_m: 8.0
splat_radius: 1
edge_threshold_m: 0.20
sync_tolerance_ms: 5.0
max_pose_gap_ms: 10.0
# Uses Odin poses only to compensate the ~94 ms LiDAR scan, not as VIO factors.
deskew: odometry
# Vendor wiki section 5.2: p_imu = T_imu_lidar p_lidar.
# Explicitly override with an independently calibrated matrix if available.
# Do not read these matrices from Odometry.covariance without checking convention.
T_imu_lidar: [1, 0, 0, -0.02663, 0, 1, 0, 0.03447, 0, 0, 1, 0.02174, 0, 0, 0, 1]
input_image_topic: /odin1/image/compressed
input_cloud_topic: /odin1/cloud_raw
input_imu_topic: /odin1/imu
input_odom_topic: /odin1/odometry
input_highfreq_odom_topic: /odin1/odometry_highfreq
